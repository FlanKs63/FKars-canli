name: Canlı alarm

# Bir çalışma ~5 saat 40 dakika sürer ve bitince bir sonrakini kendisi başlatır (zincir).
# GitHub'ın zamanlayıcısı saat başlarında çalışmaları sık sık atladığı için ona güvenmiyoruz;
# cron sadece zincir koparsa (hata, iptal) botu yeniden ayağa kaldırmak için yedek olarak duruyor.
# Aynı anda tek çalışma olur; yedek tetik, çalışan varken sıraya girip onun bitmesini bekler.
#
# Bu repo Public olduğu için GitHub dakika sınırı yok.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "Piyasalar: us, kripto, bist"
        default: "us,kripto,bist"
      minutes:
        description: "Kaç dakika çalışsın"
        default: "340"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Canlı takip
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LIVE_MARKETS: ${{ inputs.markets || 'us,kripto,bist' }}
          LIVE_MAX_MINUTES: ${{ inputs.minutes || '340' }}
        run: python live_alerts.py

      - if: always()
        uses: ./.github/actions/commit-state

      - name: Sonraki çalışmayı başlat
        # Hata olursa zincir kopar (hızlı hata döngüsü olmasın); yedek cron 30 dk içinde yeniden başlatır.
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run live.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f markets="${{ inputs.markets || 'us,kripto,bist' }}" \
            -f minutes="${{ inputs.minutes || '340' }}"
